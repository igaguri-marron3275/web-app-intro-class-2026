<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>学習記録アプリ</title>
    <link rel="stylesheet" href="/style.css" />
  </head>
  <body>
    <!-- ヘッダー -->
    <header class="header">
      <h1>学習記録アプリ</h1>
    </header>

    <!-- メインコンテンツ -->
    <main class="record-card">
      <!-- エラーメッセージ表示エリア -->
      <div id="error-message" class="error-message" style="display: none"></div>

      <!-- 学習記録入力エリア -->
      <form id="record-form" class="input-area">
        <input
          type="text"
          id="title-input"
          class="title-input"
          placeholder="新しい学習記録を入力..."
          maxlength="100"
          autocomplete="off"
          required
        />

        <select id="category-input" class="category-input" required>
          <option value="">カテゴリを選択</option>
          <option value="Web制作">Web制作</option>
          <option value="python">python</option>
          <option value="英語">英語</option>
          <option value="その他">その他</option>
        </select>

        <input type="date" id="study-date-input" class="study-date-input" required />

        <select id="understanding-input" class="understanding-input" required>
          <option value="">理解度を選択</option>
          <option value="1">よく分かった</option>
          <option value="2">少し分かった</option>
          <option value="3">復習が必要</option>
        </select>

        <button type="submit" class="record-button">追加</button>
      </form>

      <!-- 学習記録リスト -->
      <ul id="record-list" class="record-list"></ul>
    </main>

    <!-- フッター -->
    <footer class="footer">
      <p>&copy; 2026 学習記録アプリ</p>
    </footer>

    <script src="/app.js"></script>
  </body>
</html>
